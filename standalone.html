<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiClaw MCP 服务管理器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;color:#333}
#app{max-width:600px;margin:0 auto;padding:10px}
header{background:linear-gradient(135deg,#1a73e8,#4285f4);color:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
header h1{font-size:20px;margin-bottom:4px}
header p{font-size:12px;opacity:.85;margin-bottom:10px}
#search{width:100%;padding:10px 14px;border:none;border-radius:24px;font-size:14px;background:rgba(255,255,255,.95);color:#333}
#categories{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;-webkit-overflow-scrolling:touch}
#categories::-webkit-scrollbar{display:none}
.cat-btn{padding:7px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;color:#444;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s}
.cat-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.cat-btn:active{transform:scale(.95)}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.98)}
.card h3{font-size:15px;margin-bottom:4px;color:#1a1a1a}
.card p{font-size:12px;color:#666;line-height:1.4}
.card .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:10px;margin-top:6px;font-weight:500}
.tag-free{background:#e8f5e9;color:#2e7d32}
.tag-key{background:#fff3e0;color:#e65100}
.hidden{display:none}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;display:none;z-index:200}
#detail{position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f5f5;z-index:100;padding:16px;overflow-y:auto;max-width:600px;margin:0 auto}
.detail-header{display:flex;justify-content:space-between;margin-bottom:16px}
.detail-header button{padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;color:#444}
#d-name{font-size:20px;margin-bottom:6px;color:#1a1a1a}
#d-desc{color:#666;margin-bottom:14px;font-size:13px;line-height:1.5}
#d-config{background:#1e1e1e;color:#d4d4d4;padding:14px;border-radius:10px;font-size:12px;font-family:'SF Mono',Menlo,monospace;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;margin-bottom:14px;line-height:1.5}
.btn-row{display:flex;gap:10px}
.btn-row button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:active{opacity:.85}
.note{background:#fffde7;padding:10px 14px;border-radius:8px;font-size:12px;color:#888;margin-bottom:12px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MiClaw MCP 服务管理器</h1>
    <p>远程 HTTP/SSE 服务 · 复制配置粘贴到 MiClaw</p>
    <input type="text" id="search" placeholder="搜索服务...">
  </header>
  <nav id="categories"></nav>
  <main id="list"></main>
  <div id="toast"></div>
  <div id="detail" class="hidden">
    <div class="detail-header">
      <button onclick="closeDetail()">← 返回</button>
      <button id="fav-btn" onclick="toggleFav()">☆ 收藏</button>
    </div>
    <h2 id="d-name"></h2>
    <p id="d-desc"></p>
    <div class="note">MiClaw 格式：{"servers":[{...}]}</div>
    <pre id="d-config"></pre>
    <div class="btn-row">
      <button class="btn-primary" onclick="copyConfig()">📋 复制配置</button>
    </div>
  </div>
</div>
<script>
const MCP_SERVICES=[
{name:"github",cat:"开发",desc:"GitHub 仓库/Issue/PR/代码搜索",needKey:true,config:{"servers":[{"name":"github","url":"https://api.githubcopilot.com/mcp/","headers":{"Authorization":"Bearer YOUR_GITHUB_TOKEN"}}]}},
{name:"gitlab",cat:"开发",desc:"GitLab 仓库/CI/Issue/合并请求",needKey:true,config:{"servers":[{"name":"gitlab","url":"https://gitlab.com/api/v4/mcp","headers":{"Authorization":"Bearer YOUR_GITLAB_TOKEN"}}]}},
{name:"google",cat:"搜索",desc:"Google 搜索/日历/Gmail",needKey:true,config:{"servers":[{"name":"google","url":"https://mcp.google.com/mcp"}]}},
{name:"x-docs",cat:"搜索",desc:"X/Twitter API 文档搜索(免费)",needKey:false,config:{"servers":[{"name":"x-docs","url":"https://docs.x.com/mcp"}]}},
{name:"notion",cat:"办公",desc:"Notion 页面/数据库读写",needKey:true,config:{"servers":[{"name":"notion","url":"https://mcp.notion.com/mcp"}]}},
{name:"slack",cat:"通讯",desc:"Slack 消息/频道/搜索",needKey:true,config:{"servers":[{"name":"slack","url":"https://mcp.slack.com/mcp"}]}},
{name:"asana",cat:"办公",desc:"Asana 项目/任务/团队管理",needKey:true,config:{"servers":[{"name":"asana","url":"https://mcp.asana.com/sse"}]}},
{name:"linear",cat:"办公",desc:"Linear 问题/项目/周期管理",needKey:true,config:{"servers":[{"name":"linear","url":"https://mcp.linear.app/mcp"}]}},
{name:"hubspot",cat:"办公",desc:"HubSpot CRM/联系人/交易",needKey:true,config:{"servers":[{"name":"hubspot","url":"https://mcp.hubspot.com"}]}},
{name:"stripe",cat:"工具",desc:"Stripe 支付/订阅/发票",needKey:true,config:{"servers":[{"name":"stripe","url":"https://mcp.stripe.com"}]}},
{name:"figma",cat:"工具",desc:"Figma 设计文件/组件/评论",needKey:true,config:{"servers":[{"name":"figma","url":"https://mcp.figma.com/mcp"}]}},
{name:"canva",cat:"工具",desc:"Canva 设计/模板/品牌套件",needKey:true,config:{"servers":[{"name":"canva","url":"https://mcp.canva.com/mcp"}]}},
{name:"sentry",cat:"开发",desc:"Sentry 错误跟踪/性能监控",needKey:true,config:{"servers":[{"name":"sentry","url":"https://mcp.sentry.dev/mcp"}]}},
{name:"cloudflare",cat:"开发",desc:"Cloudflare Workers/KV/DNS",needKey:true,config:{"servers":[{"name":"cloudflare","url":"https://mcp.cloudflare.com/mcp"}]}},
{name:"vercel",cat:"开发",desc:"Vercel 部署/日志/环境变量",needKey:true,config:{"servers":[{"name":"vercel","url":"https://mcp.vercel.com"}]}},
{name:"neon",cat:"开发",desc:"Neon Serverless Postgres",needKey:true,config:{"servers":[{"name":"neon","url":"https://mcp.neon.tech/mcp"}]}},
{name:"supabase",cat:"开发",desc:"Supabase 数据库/认证/存储",needKey:true,config:{"servers":[{"name":"supabase","url":"https://mcp.supabase.com/mcp"}]}},
{name:"exa",cat:"搜索",desc:"Exa AI 语义搜索",needKey:true,config:{"servers":[{"name":"exa","url":"https://mcp.exa.ai/mcp"}]}},
{name:"ahrefs",cat:"搜索",desc:"Ahrefs SEO/反向链接/关键词",needKey:true,config:{"servers":[{"name":"ahrefs","url":"https://api.ahrefs.com/mcp/mcp"}]}},
{name:"slite",cat:"办公",desc:"Slite 团队知识库/笔记协作",needKey:true,config:{"servers":[{"name":"slite","url":"https://api.slite.com/mcp"}]}}
];
let favs=JSON.parse(localStorage.getItem('favs')||'[]');
let currentCat='全部',currentService=null;
function init(){renderCategories();renderList(MCP_SERVICES);document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();renderList(MCP_SERVICES.filter(s=>s.name.includes(q)||s.desc.includes(q)))})}
function renderCategories(){const cats=['全部','收藏',...new Set(MCP_SERVICES.map(s=>s.cat))];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="cat-btn ${c===currentCat?'active':''}" onclick="filterCat('${c}')">${c}</button>`).join('')}
function filterCat(cat){currentCat=cat;renderCategories();if(cat==='全部')renderList(MCP_SERVICES);else if(cat==='收藏')renderList(MCP_SERVICES.filter(s=>favs.includes(s.name)));else renderList(MCP_SERVICES.filter(s=>s.cat===cat))}
function renderList(s){document.getElementById('list').innerHTML=s.length?s.map(s=>`<div class="card" onclick="showDetail('${s.name}')"><h3>${s.name}</h3><p>${s.desc}</p><span class="tag ${s.needKey?'tag-key':'tag-free'}">${s.needKey?'需要认证':'免费'}</span></div>`).join(''):'<p style="text-align:center;color:#999;padding:40px 0">没有找到服务</p>'}
function showDetail(n){currentService=MCP_SERVICES.find(s=>s.name===n);document.getElementById('d-name').textContent=currentService.name;document.getElementById('d-desc').textContent=currentService.desc;document.getElementById('d-config').textContent=JSON.stringify(currentService.config,null,2);document.getElementById('fav-btn').textContent=favs.includes(n)?'★ 已收藏':'☆ 收藏';document.getElementById('fav-btn').className=favs.includes(n)?'faved':'';document.getElementById('detail').classList.remove('hidden');window.scrollTo(0,0)}
function closeDetail(){document.getElementById('detail').classList.add('hidden')}
function toggleFav(){if(!currentService)return;const i=favs.indexOf(currentService.name);if(i>-1)favs.splice(i,1);else favs.push(currentService.name);localStorage.setItem('favs',JSON.stringify(favs));document.getElementById('fav-btn').textContent=favs.includes(currentService.name)?'★ 已收藏':'☆ 收藏';document.getElementById('fav-btn').className=favs.includes(currentService.name)?'faved':''}
function copyConfig(){if(!currentService)return;navigator.clipboard.writeText(JSON.stringify(currentService.config,null,2)).then(()=>toast('已复制配置')).catch(()=>{const ta=document.createElement('textarea');ta.value=JSON.stringify(currentService.config,null,2);document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已复制配置')})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
init();
</script>
</body>
</html>
